
name: AVANYX APK Security Scan

"on":
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct public GitHub Release URL of the test APK"
        required: true
        type: string

permissions:
  contents: read

jobs:
  security-scan:
    name: MobSF Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download test APK
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail

          if [[ ! "$APK_URL" =~ ^https://github\.com/[^/]+/[^/]+/releases/download/[^/]+/[^/]+\.apk$ ]]; then
            echo "ERROR: Use a direct public GitHub Release APK URL."
            exit 1
          fi

          curl --fail --location --silent --show-error \
            --max-filesize 200000000 \
            "$APK_URL" --output sample.apk

          test -s sample.apk
          unzip -t sample.apk >/dev/null
          echo "APK downloaded; archive integrity check passed."
          sha256sum sample.apk

      - name: Start MobSF
        shell: bash
        run: |
          set -euo pipefail
          docker pull opensecurity/mobile-security-framework-mobsf:latest
          docker run -d --name avanyx-mobsf \
            -p 8000:8000 \
            opensecurity/mobile-security-framework-mobsf:latest

      - name: Wait for MobSF API
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 120); do
            API_KEY=$(docker logs avanyx-mobsf 2>&1 |
              grep -F "REST API Key" |
              grep -Eo '[0-9a-fA-F]{64}' |
              tail -n 1 || true)

            if [[ -n "$API_KEY" ]] &&
               curl --silent --fail http://127.0.0.1:8000/ >/dev/null; then
              echo "::add-mask::$API_KEY"
              echo "MobSF API is ready."
              echo "MOBSF_API_KEY=$API_KEY" >> "$GITHUB_ENV"
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: MobSF API did not become ready."
          exit 1

      - name: Upload APK to MobSF
        shell: bash
        run: |
          set -euo pipefail

          curl --silent --show-error --fail \
            --max-time 120 \
            -H "Authorization: $MOBSF_API_KEY" \
            -F "file=@sample.apk" \
            http://127.0.0.1:8000/api/v1/upload \
            --output upload.json

          python3 - <<'PY'
          import json
          with open("upload.json", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("hash"):
              raise SystemExit("MobSF upload failed: no scan hash returned.")
          with open("scan_hash.txt", "w", encoding="utf-8") as f:
              f.write(data["hash"])
          print("APK accepted by MobSF.")
          print("File:", data.get("file_name", "Not returned"))
          print("Scan type:", data.get("scan_type", "Not returned"))
          PY

      - name: Run static security analysis
        shell: bash
        run: |
          set -euo pipefail
          SCAN_HASH=$(cat scan_hash.txt)

          curl --silent --show-error --fail \
            --max-time 1200 \
            -H "Authorization: $MOBSF_API_KEY" \
            --data-urlencode "hash=$SCAN_HASH" \
            http://127.0.0.1:8000/api/v1/scan \
            --output scan-response.json

          curl --silent --show-error --fail \
            --max-time 120 \
            -H "Authorization: $MOBSF_API_KEY" \
            --data-urlencode "hash=$SCAN_HASH" \
            http://127.0.0.1:8000/api/v1/scorecard \
            --output scorecard.json

          curl --silent --show-error --fail \
            --max-time 120 \
            -H "Authorization: $MOBSF_API_KEY" \
            --data-urlencode "hash=$SCAN_HASH" \
            http://127.0.0.1:8000/api/v1/report_json \
            --output report.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          def load_json(filename):
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"Unexpected JSON format: {filename}")
              if data.get("error"):
                  raise SystemExit(f"MobSF error in {filename}: {data['error']}")
              return data

          scan = load_json("scan-response.json")
          scorecard = load_json("scorecard.json")
          report = load_json("report.json")

          print("\n========== AVANYX SECURITY REPORT ==========")
          for key in ("app_name", "package_name", "version_name", "file_name"):
              value = scan.get(key) or report.get(key)
              if value is not None:
                  print(f"{key}: {value}")

          score = scorecard.get("security_score")
          if score is not None:
              print(f"\nSecurity Score: {score}/100")
          else:
              print("\nSecurity Score: Not provided by this MobSF response")

          summary = scorecard.get("summary")
          if isinstance(summary, dict):
              print("\n========== FINDINGS SUMMARY ==========")
              for level, count in summary.items():
                  if isinstance(count, (int, float, str)):
                      print(f"{str(level).upper()}: {count}")

          findings = []
          seen = set()
          severity_names = {
              "critical", "high", "warning", "medium", "low", "info"
          }

          def walk(obj):
              if isinstance(obj, dict):
                  severity = str(obj.get("severity", "")).lower()
                  title = obj.get("title") or obj.get("issue") or obj.get("rule")
                  description = obj.get("description") or obj.get("details") or ""

                  if severity in severity_names and (title or description):
                      item = (severity, str(title or "Untitled finding"),
                              str(description))
                      if item not in seen:
                          seen.add(item)
                          findings.append(item)

                  for value in obj.values():
                      walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      walk(value)

          walk(report)

          important = [
              item for item in findings
              if item[0] in ("critical", "high", "warning", "medium")
          ]

          print("\n========== IMPORTANT FINDINGS ==========")
          if important:
              for severity, title, description in important[:20]:
                  print(f"\n[{severity.upper()}] {title[:200]}")
                  if description:
                      print("Details:", description.replace("\n", " ")[:350])
              if len(important) > 20:
                  print(f"Additional findings not displayed: {len(important) - 20}")
          else:
              print("No matching findings extracted by the current parser.")
              print("This does NOT prove the app has no security issues.")
              print("Check MobSF report fields if findings are missing.")

          print(f"\nSeverity-tagged findings extracted: {len(findings)}")
          print("Static analysis and report retrieval completed.")
          PY

      - name: Stop MobSF
        if: always()
        shell: bash
        run: docker rm -f avanyx-mobsf || true
